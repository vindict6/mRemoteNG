name: Build
on:
  workflow_dispatch:
    inputs:
      release_flag:
        description: 'Run NB release'
        required: false
        default: 'true'

permissions:
  contents: write
  
jobs:
  NB-Build-and-Release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Framework-Dependent builds (requires .NET runtime on user machine)
          - runner: windows-latest
            platform: x64
            arch: x64
            deployment: framework-dependent
            deploy_suffix: FD
            configuration: Release
            # OutputPath from mRemoteNG.csproj for 'Release|x64'
            output_dir: Release
          # Self-Contained builds (includes .NET runtime)
          - runner: windows-latest
            platform: x64
            arch: x64
            deployment: self-contained
            deploy_suffix: SC
            configuration: Release Self-Contained
            # PublishDir from mRemoteNG.csproj for 'Release Self-Contained|x64'
            output_dir: Publish Self-Contained
    runs-on: ${{ matrix.runner }}
    # Only run if:
    # - manual dispatch, OR
    # - push event AND commit message contains "NB release"
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'NB release'))

    # Published so Create-Combined-Release tags with the version that was actually built.
    # It cannot re-derive it: the build number comes from the T4 transform, which only runs
    # here, so reading the committed AssemblyInfo.cs there yields a stale build number.
    # Both matrix legs transform within seconds of each other and so produce the same value.
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
      message: ${{ steps.version.outputs.message }}

    steps:
      - name: (01) Checkout Repository
        uses: actions/checkout@v7

      # 2. Auto-detect solution file (Supports legacy .sln & modern VS2026 .slnx)
      - name: (02) Find solution file
        shell: pwsh
        run: |
          Write-Host "Locating solution file (.sln or .slnx)..."
          $sln = Get-ChildItem -Path . -Filter "*.sln*" -File -Recurse | 
                 Where-Object { $_.Extension -match '^\.slnx?$' } | 
                 Select-Object -First 1

          if ($sln) {
            "SOLUTION_FILE=$($sln.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Located file: $($sln.Name)" -ForegroundColor Green
          } else {
            Write-Host "ERROR: Could not locate a .sln or .slnx file!" -ForegroundColor Red
            exit 1
          }

      - name: (03) Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # AssemblyInfo.cs is generated here rather than during the build: the csproj's
      # TransformOnBuild support lives in the VS-only TextTemplating targets, which are
      # not present on a dotnet-SDK-only build. AssemblyInfo.ttinclude resolves the
      # platform from the PLATFORM env var and loads Microsoft.VisualStudio.Interop.dll
      # from mRemoteNG\libs, so no Visual Studio install is required.
      - name: (04) Install and run dotnet-t4 to transform T4 templates
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-t4
          # Refresh PATH to include global tools
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $ttFile = "$env:GITHUB_WORKSPACE\mRemoteNG\Properties\AssemblyInfo.tt"

          Write-Host "Transforming T4 template..."
          t4 $ttFile -p:platformType=${{ matrix.platform }}

          $generated = "$env:GITHUB_WORKSPACE\mRemoteNG\Properties\AssemblyInfo.cs"
          if (-not (Test-Path $generated)) {
            Write-Host "ERROR: T4 transform did not produce AssemblyInfo.cs!" -ForegroundColor Red
            exit 1
          }
          Write-Host "--- Generated AssemblyInfo.cs ---" -ForegroundColor Green
          Get-Content $generated | Select-String -Pattern 'AssemblyVersion|AssemblyConfiguration'
        env:
          PLATFORM: '${{ matrix.platform }}'

      - name: (05) Cache NuGet Packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ matrix.arch }}-${{ matrix.deployment }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-${{ matrix.deployment }}-nuget-
            ${{ runner.os }}-${{ matrix.arch }}-nuget-
            
      - name: (06) Restore NuGet Packages
        shell: pwsh
        run: |
          dotnet restore "$Env:GITHUB_WORKSPACE\$Env:SOLUTION_FILE" `
            -p:Configuration="${{ matrix.configuration }}" `
            -p:Platform=${{ matrix.platform }}

      # Resolves the MSBuild from the Visual Studio 2026 install that is already present on the
      # windows-latest image. mRemoteNG.csproj has a COMReference (MSTSCLib/aximp), and the
      # ResolveComReference task only exists in the .NET Framework build of MSBuild, so
      # `dotnet build` cannot build this solution (MSB4803).
      - name: (06.5) Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 'Release Self-Contained' needs no explicit Publish target: the csproj's PublishAfterBuild
      # target runs Publish after Build and then deletes the intermediate build dir, leaving the
      # artifact in PublishDir. TransformOnBuild is disabled so the AssemblyInfo.cs generated with
      # the correct platform in step (04) is not overwritten by an in-build transform.
      #
      # Self-contained builds the mRemoteNG project rather than the solution: PublishAfterBuild
      # deletes mRemoteNG's own output dir, and mRemoteNGTests references mRemoteNG, so a solution
      # build races it and fails with MSB3030 (mRemoteNG.dll not found). Framework-dependent has no
      # such target and builds the whole solution, which also compiles the test project.
      - name: (07) Build ${{ matrix.deployment }} Release
        shell: pwsh
        run: |
          if ('${{ matrix.deployment }}' -eq 'self-contained') {
            $target = "$Env:GITHUB_WORKSPACE\mRemoteNG\mRemoteNG.csproj"
          } else {
            $target = "$Env:GITHUB_WORKSPACE\$Env:SOLUTION_FILE"
          }
          Write-Host "Building: $target" -ForegroundColor Cyan

          msbuild "$target" `
            /restore `
            -p:Configuration="${{ matrix.configuration }}" `
            -p:Platform=${{ matrix.platform }} `
            -p:TransformOnBuild=false `
            /verbosity:minimal

      - name: (08) Verify build output
        shell: pwsh
        run: |
          $sourceDir = "$Env:GITHUB_WORKSPACE\mRemoteNG\bin\${{ matrix.platform }}\${{ matrix.output_dir }}"
          if (-not (Test-Path $sourceDir)) {
            Write-Host "ERROR: Expected output directory not found: $sourceDir" -ForegroundColor Red
            Write-Host "Contents of mRemoteNG\bin:" -ForegroundColor Yellow
            Get-ChildItem "$Env:GITHUB_WORKSPACE\mRemoteNG\bin" -Recurse -Directory | Select-Object -ExpandProperty FullName
            exit 1
          }
          if (-not (Test-Path "$sourceDir\mRemoteNG.exe")) {
            Write-Host "ERROR: mRemoteNG.exe not found in $sourceDir" -ForegroundColor Red
            Get-ChildItem $sourceDir | Select-Object -First 40 -ExpandProperty Name
            exit 1
          }
          $count = (Get-ChildItem $sourceDir -Recurse -File).Count
          Write-Host "Output OK: $sourceDir ($count files)" -ForegroundColor Green

      # Runs on the framework-dependent leg only: it is the one that builds the whole solution, so
      # mRemoteNGTests.dll is already compiled. vstest.console from the installed VS is used rather
      # than `dotnet test`, because the .NET Core MSBuild cannot evaluate mRemoteNG.csproj at all
      # (COMReference/MSB4803), even to work out where the test assembly is.
      - name: (08.5) Run unit tests
        if: matrix.deployment == 'framework-dependent'
        shell: pwsh
        run: |
          $testDll = "$Env:GITHUB_WORKSPACE\mRemoteNGTests\bin\${{ matrix.platform }}\Release\mRemoteNGTests.dll"
          if (-not (Test-Path $testDll)) {
            Write-Host "ERROR: test assembly not found at $testDll" -ForegroundColor Red
            Get-ChildItem "$Env:GITHUB_WORKSPACE\mRemoteNGTests\bin" -Recurse -Filter "*.dll" |
              Select-Object -First 20 -ExpandProperty FullName
            exit 1
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          $vstest = Join-Path $vsPath "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe"
          if (-not (Test-Path $vstest)) {
            Write-Host "ERROR: vstest.console.exe not found at $vstest" -ForegroundColor Red
            exit 1
          }

          Write-Host "Running tests from $testDll" -ForegroundColor Cyan
          & $vstest $testDll /Platform:x64 /logger:console`;verbosity=minimal
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: unit tests failed (exit $LASTEXITCODE)" -ForegroundColor Red
            exit $LASTEXITCODE
          }

      - name: (09) Release Information
        id: version
        shell: pwsh
        run: |
          $assemblyInfoPath = "${{ github.workspace }}\mRemoteNG\Properties\AssemblyInfo.cs"
          $line = Get-Content $assemblyInfoPath | Where-Object { $_ -match 'AssemblyVersion\("(.+?)"\)' }
          if ($line -match 'AssemblyVersion\("(?<ver>\d+\.\d+\.\d+)\.(?<build>\d+)"\)') {
            $version = $matches['ver']
            $build = $matches['build']
          } else {
            throw "Could not extract version and build number"
          }
          $date = Get-Date -Format "yyyyMMdd"
          $zipName = "mRemoteNG-$date-v$version-NB-$build-${{ matrix.arch }}-${{ matrix.deploy_suffix }}.zip"
          $tag = "$date-v$version-NB-($build)"
          $message = git log -1 --pretty=%B
          echo "message=$message" >> $env:GITHUB_OUTPUT
          echo "zipname=$zipName" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "build=$build" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "deployment=${{ matrix.deployment }}" >> $env:GITHUB_OUTPUT

      - name: (10) Extract Changelog Section
        id: changelog
        shell: pwsh
        run: |
          $changelogPath = "$env:GITHUB_WORKSPACE\CHANGELOG.md"
          $lines = Get-Content $changelogPath
      
          $startIndex = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## \[') {
              $startIndex = $i
              break
            }
          }
      
          if ($startIndex -eq -1) {
            throw "No version header found in CHANGELOG.md"
          }
      
          $section = @()
          for ($i = $startIndex + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## ') {
              break
            }
            $section += $lines[$i]
          }
      
          $joined = $section -join "`n"
          echo "log<<EOF" >> $env:GITHUB_OUTPUT
          echo $joined >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT
                
      - name: (11) Create Zip File
        shell: pwsh
        run: |
          $sourceDir = "$Env:GITHUB_WORKSPACE\mRemoteNG\bin\${{ matrix.platform }}\${{ matrix.output_dir }}"
          Compress-Archive -Path "$sourceDir\*" -DestinationPath ${{ steps.version.outputs.zipname }}
          echo "File: ${{ steps.version.outputs.zipname }}"
          
          # Show file size
          $fileSize = (Get-Item ${{ steps.version.outputs.zipname }}).Length / 1MB
          echo "Size: $([math]::Round($fileSize, 2)) MB"

      - name: (12) Upload artifacts for combination
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}-${{ matrix.deploy_suffix }}
          path: ${{ steps.version.outputs.zipname }}
          retention-days: 1

  Create-Combined-Release:
    needs: NB-Build-and-Release
    runs-on: windows-latest
    # Skipping this job is what makes a build-only run possible: dispatch with
    # release_flag=false to compile and get the zips as workflow artifacts without
    # publishing a release or creating a tag.
    if: github.event_name != 'workflow_dispatch' || inputs.release_flag == 'true'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Extract Changelog
        id: changelog
        shell: pwsh
        run: |
          $changelogPath = "$env:GITHUB_WORKSPACE\CHANGELOG.md"
          $lines = Get-Content $changelogPath
      
          $startIndex = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## \[') {
              $startIndex = $i
              break
            }
          }
      
          if ($startIndex -eq -1) {
            throw "No version header found in CHANGELOG.md"
          }
      
          $section = @()
          for ($i = $startIndex + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## ') {
              break
            }
            $section += $lines[$i]
          }
      
          $joined = $section -join "`n"
          echo "log<<EOF" >> $env:GITHUB_OUTPUT
          echo $joined >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      - name: Collect all release files
        shell: pwsh
        run: |
          Get-ChildItem -Path artifacts -Recurse -Filter "*.zip" | ForEach-Object {
            Copy-Item $_.FullName -Destination .
            echo "Found: $($_.Name)"
          }

      - name: Create combined release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.NB-Build-and-Release.outputs.tag }}
          name: "mRemoteNG ${{ needs.NB-Build-and-Release.outputs.version }} NB ${{ needs.NB-Build-and-Release.outputs.build }}"
          files: '*.zip'
          body: |
            ## mRemoteNG ${{ needs.NB-Build-and-Release.outputs.version }} NB Build ${{ needs.NB-Build-and-Release.outputs.build }}
            
            ### 📦 Available Downloads
            
            **Framework-Dependent (FD)** - Requires .NET 10 Runtime installed:
            - Smaller download size (~15-25 MB)
            - Requires .NET 10 Desktop Runtime on user machine
            - Files: `*-FD.zip`
            
            **Self-Contained (SC)** - Portable, no installation required:
            - Larger download size (~80-150 MB)
            - Includes .NET 10 runtime - no installation needed
            - Files: `*-SC.zip`
            
            Both versions are built for **x64** architectures.
            
            ---
            
            ### 📝 Changes in this Release
            ${{ steps.changelog.outputs.log }}
            
            ### 💬 Last Commit Message
            ${{ needs.NB-Build-and-Release.outputs.message }}

          draft: false
          prerelease: true
